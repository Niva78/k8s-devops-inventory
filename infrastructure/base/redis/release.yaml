apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  interval: 15m
  timeout: 5m
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      url: oci://registry-1.docker.io/bitnamicharts/redis
      ref:
        semver: '6.5.*'
  releaseName: redis